server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for any code that calls a relative /api path.
    # Note: this project's frontend currently calls the backend via
    # absolute http://localhost:4000/... URLs in most places, so those
    # requests bypass this proxy and go straight to the backend container's
    # published port instead. Kept here for any /api-relative calls and as
    # a base for migrating away from hardcoded localhost URLs later.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
